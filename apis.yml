aid: pasito
name: Pasito
description: >-
  Pasito is an AI-native workspace for employee benefits that helps benefits
  consultants, insurance carriers, and employers simplify every part of the
  benefits journey — from proposal and quoting through enrollment to year-round
  employee engagement — using agentic AI workflows. The platform turns
  unstructured plan documents and census data into a structured data layer that
  powers a conversational AI benefits assistant, automated proposal/RFP intake,
  benefits guides and microsites, decision support, and communications. Pasito
  reports supporting over 6.6 million employees, managing $106B in premiums, and
  serving 3,600+ employers, integrating with 950+ TPA systems and 260+ HRIS
  platforms. Backed by Google, Y Combinator, and Core Innovation Capital, the
  company is building a public-facing API but does not yet publish a developer
  portal, documentation, or API reference.
